# Linker configuration for Claude Agent
# Puts code at $6000 to avoid collision with BASIC program area ($0801+)

FEATURES {
    STARTADDRESS: default = $6000;
}

SYMBOLS {
    __STACKSIZE__: type = weak, value = $0800;
    __HIMEM__: type = weak, value = $BF00;
    __LCADDR__: type = weak, value = $D400;
    __LCSIZE__: type = weak, value = $0C00;
}

MEMORY {
    ZP:       file = "", define = yes, start = $0080, size = $001A;
    MAIN:     file = %O, define = yes, start = $6000, size = $5F00;
}

SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    STARTUP:  load = MAIN, type = ro;
    INIT:     load = MAIN, type = ro,  define = yes, optional = yes;
    ONCE:     load = MAIN, type = ro,  define = yes, optional = yes;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss, define = yes;
    IOBUF:    load = MAIN, type = bss, define = yes, align = $100;
}
