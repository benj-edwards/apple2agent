# Linker configuration for AGENT.SYSTEM
#
# ProDOS boots the first *.SYSTEM file, loading it at $2000. The tiny loader
# in SYSLOAD copies the agent image up to $6000 (where it runs) and jumps
# there. Booting straight into the agent means no BASIC.SYSTEM in memory,
# and no BRUN size limit on the agent.

FEATURES {
    STARTADDRESS: default = $2000;
}

SYMBOLS {
    __STACKSIZE__: type = weak, value = $0800;
    __HIMEM__: type = weak, value = $BF00;
    __LCADDR__: type = weak, value = $D400;
    __LCSIZE__: type = weak, value = $0C00;
}

MEMORY {
    ZP:       file = "", define = yes, start = $0080, size = $001A;
    LOADER:   file = %O, start = $2000, size = $0100, fill = yes;
    # The image may run past $6000 (its destination): SYSLOAD copies top-down.
    # MAIN, the run space, is what limits the agent's size.
    IMAGE:    file = %O, start = $2100, size = $5F00;
    MAIN:     file = "", define = yes, start = $6000, size = $5F00;
}

SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    SYSLOAD:  load = LOADER, type = ro;
    STARTUP:  load = IMAGE,  run = MAIN, type = ro, define = yes;
    INIT:     load = IMAGE,  run = MAIN, type = ro, define = yes, optional = yes;
    ONCE:     load = IMAGE,  run = MAIN, type = ro, define = yes, optional = yes;
    CODE:     load = IMAGE,  run = MAIN, type = ro;
    RODATA:   load = IMAGE,  run = MAIN, type = ro;
    DATA:     load = IMAGE,  run = MAIN, type = rw, define = yes;
    BSS:      load = MAIN,   type = bss, define = yes;
    IOBUF:    load = MAIN,   type = bss, define = yes, align = $100;
}
