# DIAG.SYSTEM: ProDOS loads it at $2000; the loader moves MAIN to $1000
# so AGENT.SYSTEM can be read into $2000 the way a normal boot does.
# $0C00 = block buffer, $1C00-$1FFF = OPEN buffer.

MEMORY {
    ZP:     file = "", start = $0000, size = $0100;
    LOADER: file = %O, start = $2000, size = $0100, fill = yes;
    IMAGE:  file = %O, start = $2100, size = $0C00;
    RUN:    file = "", start = $1000, size = $0C00;
}

SEGMENTS {
    SYSLOAD: load = LOADER, type = ro;
    MAIN:    load = IMAGE, run = RUN, type = rw, define = yes;
}
